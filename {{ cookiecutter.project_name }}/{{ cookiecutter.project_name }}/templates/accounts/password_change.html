{% extends "accounts/base.html" %}
{% load i18n %}

{% block account_content %}
<header>
  <h2 class="text-2xl font-bold mb-2">{% translate "Change Password" %}</h2>
</header>
<section>
  <form method="post">
    {% csrf_token %}
    <div class="space-y-4">
      {{ form.as_div }}
    </div>
    <button type="submit" class="mt-6 w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
      {% translate "Change Password" %}
    </button>
  </form>
</section>
{% endblock account_content %}
